name: Build Integrity Check

on:
  push:
  pull_request:

jobs:
  integrity-check:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --no-restore

      - name: Run Integrity Analyzer
        run: dotnet run --project BuildIntegrityAnalyzer

      - name: Show Integrity Summary
        run: |
          echo "## Integrity Check Result" >> $GITHUB_STEP_SUMMARY
          type integrity-report.txt >> $GITHUB_STEP_SUMMARY
